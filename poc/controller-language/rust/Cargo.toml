[package]
name = "easynet-ssh-lab"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
tokio = { version = "=1.52.3", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
