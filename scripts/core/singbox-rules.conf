# EasyNet sing-box 分流规则清单
#
# 每行格式： <tag>|<source>|<category>|<action>
#   tag      —— 规则集在配置里的 tag（也是发布出来的文件名 <tag>.srs）
#   source   —— geosite | geoip
#   category —— 官方分类名（`sing-box geosite list` / `geoip list` 可查）
#   action   —— direct（走直连）| reject（拒绝）。缺省为 direct
#
# 加/减类别只需改这个文件，然后在 VPS 上重新运行：
#     ./scripts/generate_singbox_rules.sh
#
# 生成物（<tag>.srs 与 manifest.json）发布到 ${EASYNET_WEB_ROOT:-/var/www/html}/rules/，
# 属构建产物、不进版本库；客户端由 install_singbox_client.sh 下载后落成本地文件
# （用 local 而不是 remote —— 远程规则集启动时拉不到会让 sing-box 直接起不来）。
#
# 顺序即匹配顺序：先写的先匹配（宁可直连的放前面）。
cn-domains|geosite|cn|direct
cn-ips|geoip|cn|direct
ads|geosite|category-ads-all|reject
