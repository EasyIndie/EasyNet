name: G0 native SDK producer (one shot)
on:
  workflow_dispatch:
  push:
    branches: [codex/feature/self-hosted-byos-byoc]
permissions:
  contents: read
jobs:
  compile:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run one qualified SDK producer fc71a550a532a899e19fbe1ae4c1102bc4b94a7f' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed SDK producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'fc71a550a532a899e19fbe1ae4c1102bc4b94a7f'
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify immutable sources, synthetic gate, then one conditional compile
        env:
          FROZEN_BINDING: '{"activation_message":"Run one qualified SDK producer fc71a550a532a899e19fbe1ae4c1102bc4b94a7f","checkout":"fc71a550a532a899e19fbe1ae4c1102bc4b94a7f","consumed_binding_sha256":"bd6d2f00d50ddbbeeda696edd927b682c0faf1afaf16cc9c54ca94058633c693","contract":"cd87d361f29ad214e571a510c88c276e145dcab04a1860612a61186d570f7fcd","feature":"fc71a550a532a899e19fbe1ae4c1102bc4b94a7f","grant":"one-compile-only","guest_remaining":1,"local_remaining":0,"manifest":"e3c9e4fb6ed1dd81789d9a64656c7dd8aba9ef1ab293eef7a75b9bb01ed9cb3e","python_trust":"fresh-vendor-system-entry-/usr/bin/python3-isolated-no-bytecode","python_verified":true,"qualification":"sdk-producer-hosted21-v1","schema":1,"sources":{".github/workflows/g0-client-native-build.yml":{"mode":420,"sha256":"8a92d7555bbd705d88ac7de9b13351eb3ec6235b06909b9af2099ac8b2170217","size":5412,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Host.swift":{"mode":420,"sha256":"189c478947d08115be289b553f23203d6f2bcf3cbc9001c4256bcb5b857d9a32","size":880,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Info.plist":{"mode":420,"sha256":"54d00a6f0939fa213658c54fd1d138aa7ae1f68c1471ba3d4c35abc6b2f31aaf","size":631,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Tests/test_build.py":{"mode":420,"sha256":"1bdd5a0942420ff5dbf4190b3e5a7d74b2826cc828c88102476170420b965313","size":47459,"type":"regular"},"docs/planning/poc/client-framework/native-lab/build.py":{"mode":420,"sha256":"5c90c9f83f1ccb299f98f7046dcfe1ae09404c2f1ce2f2a55f14286df7548a83","size":40288,"type":"regular"}},"status":"frozen","target":"macos-15-arm64","workflow":"8a92d7555bbd705d88ac7de9b13351eb3ec6235b06909b9af2099ac8b2170217"}'
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, sys
          def main():
            assert sys.flags.isolated and sys.flags.dont_write_bytecode
            assert (3, 9) <= sys.version_info[:2] < (3, 14)
            root = pathlib.Path.cwd().resolve()
            binding = json.loads(os.environ['FROZEN_BINDING'])
            assert binding['status'] == 'frozen' and binding['grant'] == 'one-compile-only' and binding['qualification'] == 'sdk-producer-hosted21-v1'
            actual = subprocess.check_output(['/usr/bin/git', 'rev-parse', 'HEAD'], timeout=5).decode().strip()
            assert actual == binding['feature'] == binding['checkout']
            base = 'docs/planning/poc/client-framework/native-lab/'
            names = {base + p for p in ('Host.swift', 'Info.plist', 'build.py', 'Tests/test_build.py')}
            names.add('.github/workflows/g0-client-native-build.yml')
            assert set(binding['sources']) == names
            def verified(name, expected):
              path = root / name
              assert all(not p.is_symlink() for p in (path, *path.parents))
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_size <= (65536 if name in (base + 'build.py', base + 'Tests/test_build.py') else (40960 if name == 'docs/planning/poc/client-framework/native-build-contract.md' else 32768))
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
            for name, item in binding['sources'].items():
              verified(name, item['sha256'])
            verified('docs/planning/poc/client-framework/native-build-contract.md', binding['contract'])
            manifest = json.dumps(binding['sources'], sort_keys=True, separators=(',', ':')).encode()
            assert hashlib.sha256(manifest).hexdigest() == binding['manifest']
            suite = subprocess.run(['/usr/bin/python3', '-I', '-B', str(root / base / 'Tests/test_build.py')],
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
            assert len(suite.stdout) <= 16384 and not suite.stderr
            record = json.loads(suite.stdout)
            print(json.dumps({'phase': 'synthetic', 'record': record}), flush=True)
            assert suite.returncode == 0 and record == {'schema': 1, 'tests': 21, 'failures': 0,
              'errors': 0, 'skipped': 0, 'result': 'passed', 'fixture_cleanup': 'passed',
              'failed_cases': [], 'captures': {}}
            path = root / 'docs/planning/task-bindings/native-build-runtime.json'
            verified(str(path.relative_to(root)), binding['consumed_binding_sha256'])
            previous = json.loads(path.read_bytes())
            assert previous['status'] == 'consumed' and previous['guest_remaining'] == 0
            path.unlink()  # Ephemeral checkout copy only; archived grant remains consumed.
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
            with os.fdopen(fd, 'w') as stream:
              json.dump(binding, stream)
            os.chmod(path, 0o644)
            done = subprocess.run(['/usr/bin/python3', '-I', '-B', str(root / base / 'build.py')],
                                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=185)
            assert len(done.stdout) <= 16384 and not done.stderr
            result = json.loads(done.stdout)
            print(json.dumps({'phase': 'compile', 'record': result}), flush=True)
            assert done.returncode == 0 and result['result'] == 'compiled' and result['phase'] == 'compile'
            assert result['cleanup'] == 'removed' and isinstance(result['artifact'], dict) and result['artifact_predicate'] == 'passed'
            assert result['candidate-executed'] is False and all(result[k] == 'not-run' for k in ('gui', 'engine', 'ne'))
            assert result['driver_jobs'] is None and result['sdk_metadata_stage'] == 'qualified'
            metadata = result['sdk_metadata']
            assert set(metadata) == {'sha256', 'size', 'Version', 'MaximumDeploymentTarget', 'CanonicalName', 'sdkroot-qualified'}
            assert metadata['Version'] == '15.5.0' and metadata['CanonicalName'] == 'macosx15.5' and metadata['sdkroot-qualified'] is True
            assert type(metadata['size']) is int and 0 < metadata['size'] <= 262144
            assert isinstance(metadata['sha256'], str) and len(metadata['sha256']) == 64 and all(c in '0123456789abcdef' for c in metadata['sha256'])
          try:
            main()
          except BaseException:
            print('{"schema":1,"result":"refused","error":"qualification"}', flush=True)
            sys.exit(1)
          PY
