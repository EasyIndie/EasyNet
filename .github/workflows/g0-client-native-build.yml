name: G0 native SDK semantic observation (one shot)
on:
  workflow_dispatch:
  push:
    branches: [codex/feature/self-hosted-byos-byoc]
permissions:
  contents: read
jobs:
  compile:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run one native SDK semantic observation ffcb6cfb1f080639ff2756fdda0f258aa2dc9a7a' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed SDK semantic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'ffcb6cfb1f080639ff2756fdda0f258aa2dc9a7a'
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify immutable sources, synthetic gate, then compile only
        env:
          FROZEN_BINDING: '{"activation_message":"Run one native SDK semantic observation ffcb6cfb1f080639ff2756fdda0f258aa2dc9a7a","checkout":"ffcb6cfb1f080639ff2756fdda0f258aa2dc9a7a","consumed_binding_sha256":"bd6d2f00d50ddbbeeda696edd927b682c0faf1afaf16cc9c54ca94058633c693","contract":"7f123df03b3638da814efe9a2405c11d5fceefd8b72a1a606dc027f60f577822","feature":"ffcb6cfb1f080639ff2756fdda0f258aa2dc9a7a","grant":"one-compile-only","guest_remaining":1,"local_remaining":0,"manifest":"13f462d81cf486864f68a4de6ed787e0b4bfbfd289313e1f3aea416f592e1150","python_trust":"fresh-vendor-system-entry-/usr/bin/python3-isolated-no-bytecode","python_verified":true,"qualification":"sdk-semantic-hosted18-v1","schema":1,"sources":{".github/workflows/g0-client-native-build.yml":{"mode":420,"sha256":"4d76087a9a50c713a712632e50be660e23793b086a61a33cfcd0a2813c1af0a7","size":4259,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Host.swift":{"mode":420,"sha256":"189c478947d08115be289b553f23203d6f2bcf3cbc9001c4256bcb5b857d9a32","size":880,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Info.plist":{"mode":420,"sha256":"54d00a6f0939fa213658c54fd1d138aa7ae1f68c1471ba3d4c35abc6b2f31aaf","size":631,"type":"regular"},"docs/planning/poc/client-framework/native-lab/Tests/test_build.py":{"mode":420,"sha256":"cbc114e5e526881ddac1d60c11684998998a8c2ef8a31b2221e09533f9d4757a","size":25718,"type":"regular"},"docs/planning/poc/client-framework/native-lab/build.py":{"mode":420,"sha256":"aa7cefb0e8a12179e54cacfc89f806f0285af7cf9358b450b3e16ff823d3150a","size":28730,"type":"regular"}},"status":"frozen","target":"macos-15-arm64","workflow":"4d76087a9a50c713a712632e50be660e23793b086a61a33cfcd0a2813c1af0a7"}'
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, sys
          def main():
            assert sys.flags.isolated and sys.flags.dont_write_bytecode
            assert (3, 9) <= sys.version_info[:2] < (3, 14)
            root = pathlib.Path.cwd().resolve()
            binding = json.loads(os.environ['FROZEN_BINDING'])
            assert binding['status'] == 'frozen' and binding['grant'] == 'one-compile-only'
            actual = subprocess.check_output(['/usr/bin/git', 'rev-parse', 'HEAD'], timeout=5).decode().strip()
            assert actual == binding['feature'] == binding['checkout']
            base = 'docs/planning/poc/client-framework/native-lab/'
            names = {base + p for p in ('Host.swift', 'Info.plist', 'build.py', 'Tests/test_build.py')}
            names.add('.github/workflows/g0-client-native-build.yml')
            assert set(binding['sources']) == names
            def verified(name, expected):
              path = root / name
              assert all(not p.is_symlink() for p in (path, *path.parents))
              info = path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_size <= 32768
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected
            for name, item in binding['sources'].items():
              verified(name, item['sha256'])
            verified('docs/planning/poc/client-framework/native-build-contract.md', binding['contract'])
            manifest = json.dumps(binding['sources'], sort_keys=True, separators=(',', ':')).encode()
            assert hashlib.sha256(manifest).hexdigest() == binding['manifest']
            suite = subprocess.run(['/usr/bin/python3', '-I', '-B', str(root / base / 'Tests/test_build.py')],
                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
            assert len(suite.stdout) <= 16384 and not suite.stderr
            record = json.loads(suite.stdout)
            print(json.dumps({'phase': 'synthetic', 'record': record}), flush=True)
            assert suite.returncode == 0 and record == {'schema': 1, 'tests': 18, 'failures': 0,
              'errors': 0, 'skipped': 0, 'result': 'passed', 'fixture_cleanup': 'passed',
              'failed_cases': [], 'captures': {}}
            path = root / 'docs/planning/task-bindings/native-build-runtime.json'
            verified(str(path.relative_to(root)), binding['consumed_binding_sha256'])
            previous = json.loads(path.read_bytes())
            assert previous['status'] == 'consumed' and previous['guest_remaining'] == 0
            path.unlink()  # Ephemeral checkout copy only; archived grant remains consumed.
            fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
            with os.fdopen(fd, 'w') as stream:
              json.dump(binding, stream)
            os.chmod(path, 0o644)
            done = subprocess.run(['/usr/bin/python3', '-I', '-B', str(root / base / 'build.py')],
                                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=185)
            assert len(done.stdout) <= 16384 and not done.stderr
            result = json.loads(done.stdout)
            print(json.dumps({'phase': 'compile', 'record': result}), flush=True)
            assert done.returncode == 0 and result['result'] == 'compiled'
          try:
            main()
          except BaseException:
            print('{"schema":1,"result":"refused","error":"qualification"}', flush=True)
            sys.exit(1)
          PY
