name: Tests

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  automated-tests:
    name: Automated test suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache shellcheck
        id: cache-shellcheck
        uses: actions/cache@v6
        with:
          path: /usr/local/bin/shellcheck
          key: shellcheck-${{ runner.os }}-v0.11.0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep bats parallel

      - name: Install shellcheck
        if: steps.cache-shellcheck.outputs.cache-hit != 'true'
        run: |
          SC_VERSION="v0.11.0"
          wget -q "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.linux.x86_64.tar.xz"
          tar -xf "shellcheck-$SC_VERSION.linux.x86_64.tar.xz"
          sudo mv "shellcheck-$SC_VERSION/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-$SC_VERSION" "shellcheck-$SC_VERSION.linux.x86_64.tar.xz"

      - name: Run shellcheck
        run: |
          find scripts tests -type f \( -name "*.sh" -o -name "*.bash" \) \
            -exec shellcheck --rcfile=.shellcheckrc --shell=bash --severity=style {} +

      - name: Check script file permissions
        run: |
          # Fail if any .sh file with an entrypoint guard (BASH_SOURCE[0] == $0)
          # is not tracked as executable. Library files without this guard
          # (sourced by other scripts) are intentionally 100644.
          fail=0
          while IFS= read -r file; do
            mode=$(git ls-files --stage "$file" | awk '{print $1}')
            [ "$mode" = "100755" ] && continue
            if grep -qE 'BASH_SOURCE\[0\].*==.*\$0' "$file" 2>/dev/null; then
              echo "FAIL: $file has entrypoint guard but is not executable (mode=$mode)"
              fail=1
            fi
          done < <(find scripts tests -name '*.sh' -type f | sort)
          exit $fail

      - name: Run all tests
        # 并行：GNU parallel 按文件拆分（--no-parallelize-within-files），避免用例内
        # 共享状态互相踩踏。真客户端用例（file_tags=client）由独立的
        # client-config-validation job 强制跑，这里跳过以免重复下载 ~55MB 二进制。
        run: >
          bats --timing --formatter tap
          --jobs "$(nproc)" --no-parallelize-within-files
          --filter-tags '!client'
          tests/*.bats

  integration-test:
    name: Integration test (config generation)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq ripgrep

      - name: Validate config generation (dry-run)
        run: |
          mkdir -p /tmp/easynet-test/modules/xray-reality
          cat > /tmp/easynet-test/modules/xray-reality/metadata.json <<'JSON'
          {"schemaVersion":1,"module":"xray-reality","enabled":true,"protocol":"vless","port":8443,"client":{"uri":"vless://example","clash":{"server":"10.0.0.1","port":8443}}}
          JSON
          mkdir -p /tmp/easynet-test/exposure/edge
          echo "test.example.com" > /tmp/easynet-test/exposure/edge/domain.txt
          echo "https" > /tmp/easynet-test/exposure/edge/scheme.txt
          echo "/s/test" > /tmp/easynet-test/exposure/edge/subscription_path_prefix.txt
          EASYNET_STATE_DIR=/tmp/easynet-test EASYNET_WEB_ROOT=/tmp/easynet-web \
            bash scripts/generate_subscription.sh
          [ -s /tmp/easynet-web/sub ] && echo "OK: subscription generated"
          [ -s /tmp/easynet-web/clash ] && echo "OK: clash generated"
          [ -s /tmp/easynet-web/singbox ] && echo "OK: singbox generated"
          rm -rf /tmp/easynet-test /tmp/easynet-web

  client-config-validation:
    name: Client config validation (real binaries)
    # 用**真实客户端**校验生成的订阅：mihomo 拒绝的 Clash 配置、sing-box 拒绝的
    # 配置都在这里被拦住（0.0.13 的 `invalid range: 30s` 事故就是这样漏出去的）。
    # 单 OS 即可；二进制按 pin 版本缓存，换 pin 才会重新下载。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq bats

      - name: Cache pinned client binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/easynet/client-bin
          key: clientbins-${{ runner.os }}-${{ hashFiles('scripts/core/pins.sh') }}

      - name: Validate subscriptions with real mihomo / sing-box
        env:
          # 不允许静默跳过：拉不到二进制就是失败
          EASYNET_REQUIRE_CLIENT_CHECK: "1"
        run: bats --timing --formatter tap tests/test_client_config_validation.bats

  release:
    name: Create GitHub Release
    needs: [automated-tests, integration-test, client-config-validation]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes from changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          awk -v tag="$TAG" '
            /^## \['"$TAG"'\]/ { capture=1; next }
            /^## \[/ { if (capture) exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            # 发布说明来自 CHANGELOG：缺条目时不产出 release（0.0.13 曾因此发出
            # 一个说明只有 "Release 0.0.13" 的 release）。补上条目后重新打 tag。
            echo "::error::CHANGELOG.md 缺少 [$TAG] 条目：请先补 CHANGELOG 再打 tag（发布说明从这里生成）。"
            exit 1
          fi

      - name: Build release assets
        run: |
          # 打包仓库内容（tarball 根目录即仓库根目录，保留 git 中的可执行位）
          git archive --format=tar.gz -o easynet.tar.gz HEAD
          # 生成 sha256sum -c 兼容的校验文件（固定引用 easynet.tar.gz）
          sha256sum easynet.tar.gz > easynet.tar.gz.sha256
          # 自举安装器作为固定资产发布，供 latest/download/ 稳定拉取
          cp scripts/install.sh easynet-install.sh
          ls -l easynet.tar.gz easynet.tar.gz.sha256 easynet-install.sh

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            --verify-tag \
            easynet.tar.gz \
            easynet.tar.gz.sha256 \
            easynet-install.sh
